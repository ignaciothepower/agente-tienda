[project]
name = "agente-tienda"
version = "0.1.0"
description = "Proyecto final: el agente de la tienda (Sesion 13, The Power AI Engineer)"
requires-python = ">=3.10"

# ---- ruff: linting (errores y malas practicas) + formato, en una sola herramienta
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/W estilo PEP 8 · F errores reales (variables sin usar...) · I orden de imports
# B bugs tipicos · S seguridad (bandit): p. ej. contrasenas escritas en el codigo
select = ["E", "W", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # en los tests, assert es justo lo que queremos

# ---- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
